<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Calculator for Avinox</title>
<meta name="description" content="Suggested assist level, max. watts and max. Nm per mode for Avinox M1, M2 and M2S. Einstellungsvorschläge je Modus, Deutsch und Englisch.">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: Eingaben links als feste Spalte, rechts erst die Übertragungsliste, dann die Trittfrequenz-Tabellen je Modus.
   Ein einziges dunkles Schema mit orangem Akzent, passend zur Android-App; folgt nicht der Systemeinstellung. */
:root {
  color-scheme: dark;
  --bg: #0e0e10;
  --surface: #18181b;
  --sunken: #242428;
  --fg: #f4f4f5;
  --muted: #9a9aa2;
  --line: #2e2e33;
  --accent: #ff5a1f;
  --accent-fg: #1a0a02;
  --warn: #f0b458;
  --band-ink: #14181d;
  --boost: #d9d9de;
  --f-display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.top { display: flex; flex-direction: column; gap: 6px; }
.top .lede { color: var(--muted); max-width: 62ch; }
.label { font: 600 0.78rem/1.2 var(--f-display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Eingaben */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 900px) { .panel { position: static; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .legend { font: 600 0.95rem/1.2 var(--f-display); }
.hint { font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
.err { font-size: 0.82rem; color: var(--warn); font-weight: 500; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); overflow: hidden; }
.num:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.num input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 600 1.15rem/1 var(--f-display); padding: 10px 12px; font-variant-numeric: tabular-nums; }
.num input:focus { outline: none; }
.num span { padding-right: 12px; color: var(--muted); font-size: 0.9rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; background: var(--sunken); border-radius: 7px; font-size: 0.9rem; }
.total b { font: 700 1.1rem/1 var(--f-display); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg label { flex: 1; text-align: center; padding: 9px 6px; cursor: pointer; font: 600 0.95rem/1.1 var(--f-display); color: var(--muted); border-left: 1px solid var(--line); position: relative; }
.seg label:first-of-type { border-left: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--sunken); color: var(--accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -4px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
details.helper { font-size: 0.86rem; }
details.helper summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details.helper .inner { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
details.helper select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
.example { font-size: 0.84rem; background: var(--sunken); border-radius: 7px; padding: 8px 12px; color: var(--muted); }

/* Ergebnis */
main { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sechead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.sechead p { color: var(--muted); font-size: 0.92rem; }
button.act { font: 600 0.92rem/1 var(--f-display); padding: 9px 14px; border-radius: 7px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
button.act:hover { background: var(--accent); color: var(--accent-fg); }
button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(112px, 1fr) 92px 78px 66px minmax(150px, 1.5fr); gap: 4px 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.head { background: var(--sunken); padding-block: 8px; }
.row.zone { padding-block: 5px; background: var(--bg); }
.mode { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
.sw { width: 14px; height: 14px; border-radius: 3px; background: var(--m); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.22); flex: none; }
.mode b { font: 700 1.05rem/1.1 var(--f-display); letter-spacing: 0.02em; }
.tag { font: 600 0.68rem/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.val { font: 700 1.2rem/1.1 var(--f-display); }
.val small { display: block; font: 400 0.76rem/1.2 var(--f-body); color: var(--muted); }
.meter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.track { position: relative; height: 12px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--m); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.22); border-radius: 3px; }
.track i.climb { opacity: 0.45; }
.meter span { font-size: 0.8rem; color: var(--muted); }
.meter span b { color: var(--fg); font-weight: 600; }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) 70px 58px 46px; padding-inline: 12px; gap: 6px 10px; }
  .row .meter { grid-column: 1 / -1; }
  .row.head .meterhead { display: none; }
  .val { font-size: 1.08rem; }
}
.legend-line { font-size: 0.82rem; color: var(--muted); }

/* Karten je Modus */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.band { background: var(--m); color: var(--band-ink); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.band.boost { background: var(--boost); color: var(--band-ink); }
.band b { font: 700 1.15rem/1.1 var(--f-display); letter-spacing: 0.03em; }
.band span { font-size: 0.86rem; font-weight: 500; }
.card table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.card th { font: 600 0.72rem/1.2 var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 8px 14px 6px; }
.card td { text-align: right; padding: 4px 14px; border-top: 1px solid var(--line); }
.card th:first-child, .card td:first-child { text-align: left; }
.card tr.pref td { font-weight: 600; background: var(--sunken); }
.notes { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
.notes p.w { color: var(--warn); }

.prose { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px 28px; }
@media (max-width: 760px) { .prose { grid-template-columns: minmax(0, 1fr); } }
.prose ol, .prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; font-size: 0.93rem; max-width: 65ch; }
.prose .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.altable { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.altable td { padding: 3px 8px; border-top: 1px solid var(--line); text-align: right; }
.altable td:nth-child(odd) { color: var(--muted); text-align: left; }
footer { color: var(--muted); font-size: 0.84rem; max-width: 80ch; display: flex; flex-direction: column; gap: 6px; }
#copyfallback { width: 100%; min-height: 9em; font: 0.85rem/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; }

.toprow { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.lang { display: flex; flex: none; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.lang button { font: 600 0.82rem/1 var(--f-display); letter-spacing: 0.04em; padding: 8px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--sunken); color: var(--accent); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

.results { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 22px; display: flex; flex-direction: column; gap: 8px; }
.empty p { color: var(--muted); max-width: 56ch; }
button.reset { align-self: flex-start; font: 600 0.9rem/1 var(--f-display); padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
button.reset:hover { color: var(--fg); border-color: var(--muted); }
button.reset.armed { color: var(--warn); border-color: var(--warn); }
button.reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }


/* Helles Design: vom Umschalter gesetzt, unabhängig von der Systemeinstellung */
:root { --boost-ink: #14181d; }
:root[data-look="light"] {
  color-scheme: light;
  --bg: #f1f2f4; --surface: #ffffff; --sunken: #e6e8ec; --fg: #16181d; --muted: #5b6470; --line: #d5d9df;
  --accent: #c2410c; --accent-fg: #ffffff; --warn: #9a5b00; --boost: #3a4049; --boost-ink: #ffffff;
}
.band.boost { color: var(--boost-ink); }
.toprow { flex-wrap: wrap; }
.toggles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.viewbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.speed { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
.speed span { min-width: 9ch; text-align: center; color: var(--fg); font-weight: 600; }
.sb { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 600 1.05rem/1 var(--f-display); cursor: pointer; padding: 0; }
.sb:hover:not(:disabled) { border-color: var(--muted); }
.sb:disabled { opacity: 0.35; cursor: default; }
.sb:focus-visible, .tgl:focus-visible, .link:focus-visible, .chk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Liste mit Haken links und Dreieck rechts */
.row { grid-template-columns: 22px minmax(112px, 1fr) 92px 78px 66px minmax(150px, 1.5fr) 30px; }
.chk { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.row.done .val, .row.done .mode b { color: var(--muted); }
.val.adj, .stp b.adj { color: var(--accent); }
.tag.adj { color: var(--accent); border-color: var(--accent); }
.tgl { width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 6px; padding: 0; }
.tgl:hover { background: var(--sunken); }
.tri { width: 11px; height: 7px; background: var(--muted); clip-path: polygon(0 0, 100% 0, 50% 100%); }
.row.open .tri { clip-path: polygon(0 100%, 50% 0, 100% 100%); background: var(--accent); }
.adjust { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; padding: 12px 16px 14px; background: var(--bg); border-top: 1px solid var(--line); }
.stp { display: flex; flex-direction: column; gap: 5px; }
.stp .ctl { display: flex; align-items: center; gap: 8px; }
.stp b { font: 700 1.1rem/1 var(--f-display); min-width: 4ch; text-align: center; }
.stp small { font-size: 0.74rem; color: var(--muted); }
.stp.end { justify-content: center; align-self: center; }
.adjhint { flex-basis: 100%; font-size: 0.8rem; color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font: 600 0.88rem/1.2 var(--f-display); cursor: pointer; }
.link:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
.progress { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 0.9rem; font-weight: 500; }
@media (max-width: 640px) {
  .row { grid-template-columns: 22px minmax(0, 1fr) 62px 54px 42px 28px; gap: 6px 8px; }
  .row .meter { grid-column: 1 / -1; grid-row: 2; }
  .row .tgl { grid-column: 6; grid-row: 1; width: 28px; }
}


/* Schalter "Erweitert": aus = Standardrechner ohne Haken, Anpassen und Steigung */
.switch { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; padding: 5px 0; cursor: pointer; color: var(--fg); font: 600 0.95rem/1 var(--f-display); letter-spacing: 0.02em; }
.switch .knob { width: 36px; height: 20px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line); position: relative; flex: none; box-sizing: border-box; transition: background 0.15s, border-color 0.15s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform 0.15s, background 0.15s; }
.switch[aria-checked="true"] .knob { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"] .knob::after { transform: translateX(16px); background: var(--accent-fg); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.advhint { font-size: 0.84rem; color: var(--muted); }
.gradeshort { font-size: 0.88rem; color: var(--fg); border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }
.list.basic .row { grid-template-columns: minmax(112px, 1fr) 92px 78px 66px minmax(150px, 1.5fr); }
@media (max-width: 640px) {
  .list.basic .row { grid-template-columns: minmax(0, 1fr) 70px 58px 46px; gap: 6px 10px; }
}
@media (prefers-reduced-motion: reduce) { .switch .knob, .switch .knob::after { transition: none; } }





/* Profile, Teilen, Vergleich und Druckansicht */
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; }
button.act.quiet { border-color: var(--line); color: var(--fg); }
button.act.quiet:hover { background: var(--sunken); color: var(--fg); border-color: var(--muted); }
.profiles { padding-bottom: 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 600 0.9rem/1 var(--f-display); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--sunken); }
.chip.add { border-style: dashed; color: var(--muted); }
.chip .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 7px; vertical-align: 1px; }
.profrow { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 0.86rem; line-height: 1.35; }
.profrow.warn > span { color: var(--warn); flex: 1 1 100%; }
.profrow .hint { flex: 1 1 100%; }
.mini { font: 600 0.86rem/1 var(--f-display); padding: 8px 11px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.mini:hover { border-color: var(--muted); }
.mini.go { border-color: var(--accent); color: var(--accent); }
.mini.go:hover { background: var(--accent); color: var(--accent-fg); }
.txt { flex: 1 1 120px; min-width: 0; font: 600 1rem/1 var(--f-display); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.link.danger { color: var(--muted); margin-left: auto; }
.link.danger:hover { color: var(--warn); }
.chip:focus-visible, .mini:focus-visible, .txt:focus-visible, .cmpbar select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#profFallback { width: 100%; min-height: 7em; font: 0.8rem/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; }
.notice { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 0.92rem; }
.notice span { flex: 1 1 260px; }
.cmpbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.cmpbar label { font: 600 0.95rem/1.2 var(--f-display); }
.cmpbar select { font: 600 0.95rem/1.2 var(--f-display); padding: 8px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); max-width: 100%; min-width: 0; }
.list.cmp .row { grid-template-columns: minmax(96px, 0.5fr) minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.list.cmp .row .mode { padding-top: 2px; }
.cval, .chead { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cval b { font: 600 1.02rem/1.25 var(--f-display); }
.cval small, .chead small { font-size: 0.8rem; color: var(--muted); line-height: 1.3; }
.cval .adj { color: var(--accent); }
.cval.none { color: var(--muted); }
.chead b { font: 600 0.98rem/1.2 var(--f-display); overflow-wrap: anywhere; }
@media (max-width: 640px) {
  .list.cmp .row { grid-template-columns: 74px minmax(0, 1fr) minmax(0, 1fr); gap: 6px 8px; }
  .list.cmp .mode { gap: 6px; }
  .list.cmp .mode b { font-size: 0.9rem; }
  .cval b { font-size: 0.9rem; }
  .cval small, .chead small { font-size: 0.74rem; }
}
/* Die Eingabespalte bleibt stehen. Ist sie höher als das Fenster, rollt sie in sich, damit alles erreichbar bleibt. */
@media (min-width: 901px) { .panel { max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; } }
/* Setup-Karte: immer hell wie Papier, unabhängig vom gewählten Design */
.sheetwrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
.sheetbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.sheetbar .hint { flex: 1 1 220px; }
.sheet { background: #fff; color: #111418; border-radius: 6px; padding: 28px 30px; display: flex; flex-direction: column; gap: 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.sheet h1 { font-size: 1.6rem; color: #111418; }
.sheet .sub { color: #555c66; font-size: 0.9rem; }
.sheet dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 18px; margin: 0; padding: 12px 0; border-block: 1px solid #c9ced6; }
.sheet dt { font: 600 0.7rem/1.2 var(--f-display); letter-spacing: 0.07em; text-transform: uppercase; color: #555c66; }
.sheet dd { margin: 2px 0 0; font: 600 1rem/1.3 var(--f-display); }
.sheet table { width: 100%; border-collapse: collapse; }
.sheet th { font: 600 0.7rem/1.2 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: #555c66; text-align: right; padding: 6px 8px; border-bottom: 2px solid #111418; vertical-align: bottom; }
.sheet td { text-align: right; padding: 8px; border-bottom: 1px solid #c9ced6; font: 700 1.08rem/1.2 var(--f-display); vertical-align: middle; }
.sheet td small { display: block; font: 400 0.74rem/1.2 var(--f-body); color: #555c66; }
.sheet th:nth-child(2), .sheet td:nth-child(2) { text-align: left; white-space: nowrap; }
.sheet td.soft { font-weight: 500; font-size: 0.95rem; color: #333a44; }
.sheet td.box { width: 28px; padding-right: 0; text-align: left; }
.sheet td.box i { display: inline-block; width: 15px; height: 15px; border: 1.5px solid #111418; border-radius: 3px; vertical-align: middle; }
.sheet .sw { display: inline-block; width: 11px; height: 11px; margin-right: 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.25); }
.sheet tr.zone td { text-align: left; font: 600 0.7rem/1.2 var(--f-display); letter-spacing: 0.07em; text-transform: uppercase; color: #555c66; background: #eef0f3; padding: 5px 8px; }
.sheet .foot { font-size: 0.78rem; line-height: 1.4; color: #555c66; display: flex; flex-direction: column; gap: 4px; }
@media screen and (max-width: 640px) {
  .sheet { padding: 18px 14px; }
  .sheet .opt { display: none; }
  .sheet th, .sheet td { padding: 7px 5px; }
  .sheet td { font-size: 1rem; }
}
@media print {
  .has-sheet body { background: #fff; }
  .has-sheet .wrap { display: none !important; }
  .has-sheet #sheetWrap { display: flex !important; padding: 0; max-width: none; }
  .has-sheet .sheetbar { display: none !important; }
  .has-sheet .sheet { padding: 0; border-radius: 0; }
  @page { margin: 14mm; }
}

/* Aufgeklappte Stufe mit "Erweitert": links die Tabelle nach Trittfrequenz, rechts das Nachstellen */
.adjust { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.25fr); gap: 14px 24px; align-items: start; }
.adjtable { max-width: 420px; }
.adjctl { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-start; min-width: 0; }
@media (max-width: 760px) { .adjust { grid-template-columns: minmax(0, 1fr); } .adjtable { max-width: none; } }

/* i-Knopf mit Erklärung: am PC beim Drüberfahren, überall per Klick oder Antippen */
.tiphost { position: relative; }
.labelrow { display: flex; align-items: center; gap: 8px; }
.infobtn { position: relative; width: 20px; height: 20px; flex: none; display: inline-grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--muted); background: transparent; color: var(--muted); font: italic 700 0.8rem/1 Georgia, "Times New Roman", serif; text-transform: none; letter-spacing: 0; cursor: pointer; }
.infobtn::after { content: ""; position: absolute; inset: -10px; }
.infobtn:hover, .infobtn[aria-expanded="true"] { color: var(--accent); border-color: var(--accent); }
.infobtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip { display: none; position: absolute; z-index: 6; left: 0; right: 0; top: calc(100% + 8px); background: var(--surface); color: var(--fg); border: 1px solid var(--muted); border-radius: 8px; padding: 10px 12px; font: 400 0.84rem/1.45 var(--f-body); letter-spacing: 0; text-transform: none; text-align: left; box-shadow: 0 8px 24px rgb(0 0 0 / 0.35); }
.infobtn[aria-expanded="true"] + .tip { display: block; }
@media (hover: hover) { .infobtn:hover + .tip { display: block; } }
.row.head .meterhead { display: flex; align-items: center; gap: 8px; }
@media (max-width: 640px) { .row.head .meterhead { display: flex; grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="toprow">
      <span class="label">M1 · M2 · M2S</span>
      <div class="toggles">
        <div class="lang" role="group" id="lookGroup">
          <button type="button" id="look-dark" aria-pressed="true" data-i18n="lookDark"></button>
          <button type="button" id="look-light" aria-pressed="false" data-i18n="lookLight"></button>
        </div>
        <div class="lang" role="group" aria-label="Sprache / Language">
          <button type="button" id="lang-de" aria-pressed="false">DE</button>
          <button type="button" id="lang-en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="layout">
    <form class="panel" id="inputs" autocomplete="off">
      <div class="field profiles" id="profField">
        <span class="legend" data-i18n="profTitle"></span>
        <div class="chips" id="profChips"></div>
        <div class="profrow" id="profNew" hidden>
          <input type="text" class="txt" id="profName" maxlength="24" autocomplete="off">
          <button type="button" class="mini go" id="profCreate" data-i18n="profSave"></button>
          <button type="button" class="mini" id="profCancel" data-i18n="cancel"></button>
          <span class="hint" data-i18n="profNewHint"></span>
        </div>
        <div class="profrow warn" id="profState" hidden>
          <span id="profStateText"></span>
          <button type="button" class="mini go" id="profSave" data-i18n="profSave"></button>
          <button type="button" class="mini" id="profDiscard" data-i18n="profDiscard"></button>
        </div>
        <div class="profrow warn" id="profGuard" hidden>
          <span data-i18n="profGuard"></span>
          <button type="button" class="mini go" id="profSwitch" data-i18n="profSwitch"></button>
          <button type="button" class="mini" id="profStay" data-i18n="cancel"></button>
        </div>
        <span class="hint" id="profHint"></span>
        <div class="profrow">
          <button type="button" class="link" id="profExport" data-i18n="profExport" hidden></button>
          <button type="button" class="link" id="profImport" data-i18n="profImport"></button>
          <button type="button" class="link danger" id="profDelete" hidden></button>
          <input type="file" id="profFile" accept=".json,application/json" hidden>
        </div>
        <span class="hint" id="profMsg" role="status"></span>
        <textarea id="profFallback" hidden readonly></textarea>
      </div>

      <fieldset class="field">
        <span class="legend" data-i18n="motor"></span>
        <div class="seg">
          <label><input type="radio" name="motor" id="motor-M1" value="M1">M1</label>
          <label><input type="radio" name="motor" id="motor-M2" value="M2">M2</label>
          <label><input type="radio" name="motor" id="motor-M2S" value="M2S">M2S</label>
        </div>
        <span class="hint" id="motorHint"></span>
      </fieldset>

      <fieldset class="field" id="batteryField" hidden>
        <span class="legend" data-i18n="battery"></span>
        <div class="seg">
          <label><input type="radio" name="battery" id="battery-fp" value="fp">FP700 / RS800</label>
          <label><input type="radio" name="battery" id="battery-fs" value="fs">FS800 / FS600</label>
        </div>
        <span class="hint" id="batteryHint"></span>
      </fieldset>

      <div class="field">
        <div class="pair">
          <div class="field">
            <label for="bike" data-i18n="bike"></label>
            <div class="num"><input id="bike" type="number" inputmode="decimal" min="10" max="45" step="0.5"><span>kg</span></div>
          </div>
          <div class="field">
            <label for="rider" data-i18n="rider"></label>
            <div class="num"><input id="rider" type="number" inputmode="decimal" min="40" max="180" step="0.5"><span>kg</span></div>
          </div>
        </div>
        <span class="hint" data-i18n="weightHint"></span>
        <span class="err" id="err-weight" hidden></span>
        <div class="total"><span data-i18n="total"></span><b id="total"></b></div>
      </div>

      <div class="field">
        <div class="labelrow tiphost">
          <label for="power" data-i18n="power"></label>
          <button type="button" class="infobtn" aria-expanded="false" aria-controls="tipPower">i</button><span class="tip" id="tipPower" data-i18n="powerTip"></span>
        </div>
        <div class="num"><input id="power" type="number" inputmode="numeric" min="50" max="500" step="5"><span data-i18n="unitW"></span></div>
        <span class="hint" data-i18n="powerHint"></span>
        <span class="err" id="err-power" hidden></span>
      </div>

      <div class="field">
        <label for="cadence" data-i18n="cadence"></label>
        <div class="num"><input id="cadence" type="number" inputmode="numeric" min="40" max="120" step="1"><span data-i18n="unitRpm"></span></div>
        <span class="err" id="err-cadence" hidden></span>
        <details class="helper" id="cadHelper">
          <summary data-i18n="gearSummary"></summary>
          <div class="inner">
            <span class="hint" data-i18n="gearQuestion"></span>
            <div class="pair">
              <select id="ring"></select>
              <select id="gear"></select>
            </div>
          </div>
        </details>
      </div>

      <fieldset class="field">
        <span class="legend" data-i18n="scope"></span>
        <div class="seg">
          <label><input type="radio" name="scope" id="scope-four" value="four" checked><span data-i18n="scopeFour"></span></label>
          <label><input type="radio" name="scope" id="scope-all" value="all"><span data-i18n="scopeAll"></span></label>
        </div>
        <span class="hint" id="scopeHint"></span>
      </fieldset>

      <fieldset class="field" id="profileField">
        <span class="legend" data-i18n="focus"></span>
        <div class="seg">
          <label><input type="radio" name="profile" id="profile-allround" value="allround" checked><span data-i18n="pAllround"></span></label>
          <label><input type="radio" name="profile" id="profile-long" value="long"><span data-i18n="pLong"></span></label>
          <label><input type="radio" name="profile" id="profile-power" value="power"><span data-i18n="pPower"></span></label>
        </div>
        <span class="hint" id="profileHint"></span>
      </fieldset>

      <span class="hint" data-i18n="rangeNote"></span>
      <button type="button" class="reset" id="reset"></button>
    </form>

    <main>
      <div class="notice" id="sharedBox" hidden>
        <span id="sharedText"></span>
        <button type="button" class="mini go" id="sharedBack" data-i18n="sharedBack"></button>
        <button type="button" class="mini" id="sharedClose" data-i18n="close"></button>
      </div>
      <div class="empty" id="empty" hidden>
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n="emptyText"></p>
      </div>

      <div class="results" id="results">
      <section>
        <div class="sechead">
          <div>
            <h2 data-i18n="h2settings"></h2>
            <p id="summary"></p>
          </div>
          <div class="acts">
            <button type="button" class="act" id="copy"></button>
            <button type="button" class="act quiet" id="share"></button>
            <button type="button" class="act quiet" id="print" data-i18n="printBtn"></button>
          </div>
        </div>
        <div class="viewbar">
          <button type="button" class="switch" id="adv" role="switch" aria-checked="false"><i class="knob"></i><span data-i18n="adv"></span></button>
          <span class="advhint" id="advHint" data-i18n="advHint"></span>
          <div class="lang" role="group" id="unitGroup" hidden>
            <button type="button" id="unit-wkg" aria-pressed="true">W/kg</button>
            <button type="button" id="unit-grade" aria-pressed="false" data-i18n="unitGrade"></button>
          </div>
          <div class="speed" id="speedBox" hidden>
            <button type="button" class="sb" id="speed-less">−</button>
            <span id="speedText"></span>
            <button type="button" class="sb" id="speed-more">+</button>
          </div>
          <span class="advhint" id="speedNote" data-i18n="speedNote" hidden></span>
        </div>
        <p class="gradeshort" id="gradeShort" hidden></p>
        <div class="list" id="list"></div>
        <div class="progress" id="progressBox" hidden>
          <span id="progressText"></span>
          <button type="button" class="link" id="clearChecks" data-i18n="clearChecks" hidden></button>
        </div>
        <p class="legend-line" id="progressHint" data-i18n="progressHint" hidden></p>
        <p class="legend-line" id="gradeNote" hidden></p>
        <textarea id="copyfallback" hidden readonly></textarea>
      </section>

      <section id="cmpSection" hidden>
        <div class="sechead">
          <div>
            <h2 data-i18n="cmpTitle"></h2>
            <p data-i18n="cmpSub"></p>
          </div>
        </div>
        <div class="cmpbar">
          <label for="cmpSel" data-i18n="cmpLabel"></label>
          <select id="cmpSel"></select>
        </div>
        <p class="legend-line" id="cmpNone" data-i18n="cmpNone" hidden></p>
        <div class="list cmp" id="cmpTable" hidden></div>
      </section>

      <section id="cardsSection">
        <div class="sechead">
          <div>
            <h2 data-i18n="h2power"></h2>
            <p data-i18n="h2powerSub"></p>
          </div>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <section>
        <h2 data-i18n="h2how"></h2>

          <div class="col">
            <ol id="rules"></ol>
            <ul id="tips"></ul>
          </div>
          <div class="col">
            <h3 data-i18n="alTitle"></h3>
            <table class="altable" id="altable"></table>
            <span class="hint" data-i18n="alHint"></span>
          </div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <footer>
    <p data-i18n="foot1"></p>

<div class="sheetwrap" id="sheetWrap" hidden>

    <button type="button" class="mini" id="sheetBack" data-i18n="sheetBack"></button>
    <button type="button" class="mini go" id="sheetPrint" data-i18n="sheetPrint"></button>
    <span class="hint" data-i18n="sheetHint"></span>
  </div>

<script>
/* Rechenkern: Setup-Rechner für Avinox.
   Rechenweg nach dem Setup-Guide von Bernd Hemmersbach (Vorabfassung 11.05.2026)
   und den Blättern "Generelles Setup" (M1, M2, M2S). */
var AvinoxCalc = (function () {
  // Assist Level -> Unterstützung in % (Testfahrten des Autors mit dem M1)
  var AL = [0, 30, 60, 80, 100, 125, 150, 175, 225, 300, 375, 450, 525, 675, 825, 950];
  var K = 9.55; // Watt = Nm x U/min / 9,55

  var MOTORS = {
    M1:  { label: 'M1',  nm: 105, watt: 1000, boostNm: 120, boostW: 1000 },
    M2:  { label: 'M2',  nm: 110, watt: 1000, boostNm: 125, boostW: 1100 },
    // Beim M2S hängt die Spitzenleistung laut DJI vom Akku ab: 1500 W mit FP700/RS800, 1300 W mit FS800/FS600
    M2S: { label: 'M2S', nm: 130, watt: 1300, boostNm: 150, boostW: 1500, batteries: { fp: 1500, fs: 1300 } }
  };
  // Motor mit der Spitzenleistung des gewählten Akkus. Ohne Angabe gilt der höhere Wert.
  function motorFor(name, battery) {
    var M = MOTORS[name];
    if (!M || !M.batteries || !M.batteries[battery]) return M;
    var out = {}, k;
    for (k in M) out[k] = M[k];
    out.boostW = M.batteries[battery];
    return out;
  }

  // Zielwerte in Watt Motorleistung je kg Gesamtgewicht (Guide 2.5, 3.5, 3.6)
  var PROFILES = {
    allround: { label: 'Alleskönner', modes: {
      ECO: { t: 1.4, band: [1, 1.5] }, AUTO: { t: 2.75, band: [2, 3] },
      TRAIL: { t: 5.5, band: [4.5, 6] }, TURBO: { t: 7.75, band: [6, 8] } } },
    long: { label: 'Langstrecke', modes: {
      ECO: { t: 0.9, band: [0.75, 1] }, AUTO: { t: 1.8, band: [1.5, 2] },
      TRAIL: { t: 2.75, band: [2.5, 3.5] }, TURBO: { t: 4.1, band: [3.5, 5] } } },
    power: { label: 'Power', modes: {
      ECO: { t: 1.8, band: [1.5, 2] }, AUTO: { t: 4.1, band: [3, 4.5] },
      TRAIL: { t: 6.4, band: [6, 7.5] }, TURBO: { t: 9.1, band: [7.5, 10] } } }
  };

  // Modus-Leitern der Blätter "Generelles Setup"
  var LADDERS = {
    M1: [
      { name: 'LOW',    zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'ECO',    zone: 'low',  t: 1.4, al: 'below', std: 'ECO' },
      { name: 'ROAD',   zone: 'low',  t: 2.0, al: 'below' },
      { name: 'AUTO',   zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL',  zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO',  zone: 'mid',  t: 5.6, std: 'TURBO' },
      { name: 'BEAST',  zone: 'high', t: 7.5 },
      { name: 'ALL IN', zone: 'high', top: true }
    ],
    M2: [
      { name: 'LOW',   zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'FLAT',  zone: 'low',  t: 1.4, al: 'below' },
      { name: 'ECO',   zone: 'low',  t: 1.8, std: 'ECO' },
      { name: 'ROAD',  zone: 'mid',  t: 2.2 },
      { name: 'AUTO',  zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL', zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO', zone: 'high', t: 5.6, std: 'TURBO' },
      { name: 'POWER', zone: 'high', t: 7.5 },
      { name: 'BEAST', zone: 'high', top: true }
    ],
    M2S: [
      { name: 'LOW',    zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'ECO',    zone: 'low',  t: 1.4, al: 'below', std: 'ECO' },
      { name: 'ROAD',   zone: 'low',  t: 2.1, al: 'below' },
      { name: 'AUTO',   zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL',  zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO',  zone: 'mid',  t: 5.6, std: 'TURBO' },
      { name: 'BEAST',  zone: 'high', t: 7.5 },
      { name: 'ALL IN', zone: 'high', t: 9.0 },
      { name: 'MTWOS',  zone: 'high', top: true }
    ]
  };

  // Einstellbereiche der vier Werksmodi (Guide 1.2, M1). Obergrenzen folgen dem Motor.
  function limits(std, M) {
    switch (std) {
      case 'ECO':   return { al: [1, 7],  nm: [10, 70],   w: [100, 400] };
      case 'AUTO':  return { al: [3, 11], nm: [10, M.nm], w: [200, M.watt] };
      case 'TRAIL': return { al: [6, 13], nm: [20, M.nm], w: [300, M.watt] };
      case 'TURBO': return { al: [8, 15], nm: [60, M.nm], w: [400, M.watt] };
      default:      return { al: [1, 15], nm: [10, M.nm], w: [100, M.watt] };
    }
  }

  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function ceil5(x) { return Math.ceil((x - 1e-9) / 5) * 5; }
  function round50(x) { return Math.round(x / 50 + 1e-9) * 50; }
  function round100(x) { return Math.round(x / 100 + 1e-9) * 100; }

  // Nächsthöhere Stufe, die die nötige Unterstützung liefert (2 % Toleranz)
  function alMatch(watt, own) {
    var req = watt / own * 100;
    for (var L = 1; L <= 15; L++) if (AL[L] >= req * 0.98) return L;
    return 15;
  }
  // Höchste Stufe, die unter der Wattgrenze bleibt (Reichweiten-Stufen)
  function alBelow(watt, own) {
    var req = watt / own * 100, r = 1;
    for (var L = 1; L <= 15; L++) if (AL[L] < req - 1e-9) r = L;
    return r;
  }

  function build(defs, inp, M, ladder) {
    var kg = inp.bike + inp.rider, own = inp.power, cad = inp.cadence;
    var n = defs.length, i;
    var modes = defs.map(function (d) {
      return { name: d.name, zone: d.zone || null, custom: !d.std, range: !!d.range,
               band: d.band || null, lim: limits(d.std, M), flags: {} };
    });

    // 1. max. Watt aus Zielwert x Gesamtgewicht
    for (i = 0; i < n; i++) {
      var d = defs[i], m = modes[i], w;
      if (d.top) w = M.watt;
      else {
        var raw = d.t * kg;
        w = (ladder && raw >= 500) ? round100(raw) : round50(raw);
        var c = clamp(w, m.lim.w[0], m.lim.w[1]);
        if (c > w) m.flags.wattMin = true;
        if (c < w) m.flags.wattMax = true;
        w = c;
      }
      m.watt = w;
    }
    for (i = 1; i < n; i++) if (!defs[i].top && modes[i].watt < modes[i - 1].watt + 50)
      modes[i].watt = Math.min(modes[i].lim.w[1], modes[i - 1].watt + 50);
    for (i = n - 2; i >= 0; i--) {
      var step = (ladder && modes[i + 1].watt > 500) ? 100 : 50;
      var cap = Math.max(modes[i].lim.w[0], modes[i + 1].watt - step);
      if (modes[i].watt > cap) { modes[i].watt = cap; modes[i].flags.wattMax = true; }
    }

    // 2. Assist Level aus Wattgrenze / Eigenleistung
    var prevHi = 0, prevRange = false;
    for (i = 0; i < n; i++) {
      var d2 = defs[i], m2 = modes[i], L = m2.lim.al, lo, hi;
      if (d2.range) {
        hi = clamp(alMatch(m2.watt, own), L[0], L[1]);
        lo = prevRange ? Math.max(L[0], prevHi) : Math.max(L[0], Math.min(prevHi + 1, hi - 2));
        if (hi <= lo) hi = Math.min(L[1], lo + 1);
        if (hi <= lo) lo = hi - 1;
      } else {
        var a = d2.al === 'below' ? alBelow(m2.watt, own) : alMatch(m2.watt, own);
        if (d2.top) a += 1; // Reserve, damit die volle Leistung auch mit müden Beinen anliegt
        a = Math.max(a, d2.zone === 'low' ? prevHi + 1 : prevHi);
        lo = hi = clamp(a, L[0], L[1]);
      }
      m2.alLo = lo; m2.alHi = hi;
      prevHi = hi; prevRange = !!d2.range;
    }

    // 3. max. Nm aus Wattgrenze und Lieblings-Trittfrequenz
    for (i = 0; i < n; i++) {
      var d3 = defs[i], m3 = modes[i];
      var base = d3.nmEff ? Math.min(m3.watt, AL[m3.alHi] / 100 * own) : m3.watt;
      var nm = ceil5(base * K / cad);
      var cn = clamp(nm, m3.lim.nm[0], m3.lim.nm[1]);
      if (cn < nm) m3.flags.nmMax = true;
      if (cn > nm) m3.flags.nmMin = true;
      m3.nm = cn;
    }
    if (ladder) for (i = n - 2; i >= 0; i--) {

  var GRADE = { eta: 0.96, crr: 0.015, cda: 0.6, rho: 1.2, g: 9.81 };

    var reach = Math.min(m.watt, m.alWatt);
    if (next && m.watt > next.watt) out.push({ w: true, t: T.nOver(next.name) });
    if (m.nmWatt < reach - eps) out.push({ w: true, t: T.nNm(cad, w(m.nmWatt), w(m.watt), m.rpmForMax) });
    if (m.alWatt < m.watt - eps) out.push({ t: T.nAl(w(inp.power), w(m.alWatt), w(m.watt)) });
    if (m.band) {
      if (m.wkg < m.band[0] - 0.005) out.push({ w: true, t: T.nBelow(one(m.band[0]), one(m.band[1])) });
      else out.push({ t: T.nBand(one(m.band[0]), one(m.band[1])) });
    }
    if (m.flags.nmMin || m.flags.wattMin) out.push({ t: T.nMin });
    if (m.flags.nmSpread && !m.delta.nm) out.push({ t: T.nSpread });
    return out;
  }

  // Ein Regler im Bereich "Anpassen": Minus, Wert, Plus und darunter der berechnete Wert
  function stepper(m, field, label, value, calc, step, min, max, text, calcText) {
    function btn(d, sym, word) {
      var ok = d < 0 ? value + d >= min : value + d <= max;
      return '<button type="button" class="sb" data-m="' + m.name + '" data-f="' + field + '" data-d="' + d + '"' + (ok ? '' : ' disabled') +
        ' aria-label="' + label + ' ' + word + '">' + sym + '</button>';
    }
    return '<div class="stp"><span class="label">' + label + '</span><div class="ctl">' + btn(-step, '−', T.less) +
      '<b' + (value !== calc ? ' class="adj"' : '') + '>' + text + '</b>' + btn(step, '+', T.more) + '</div>' +
      '<small>' + (value !== calc ? T.adjCalc(calcText) : '&nbsp;') + '</small></div>';
  }
  // Tabelle nach Trittfrequenz und Hinweise einer Stufe, für die Karte und für den aufgeklappten Bereich
  function tableHtml(m, r, inp, next) {
    var boost = m.name === 'BOOST', two = !boost && m.alLo !== m.alHi;
    var c = '<table><thead><tr><th>' + T.thRpm + '</th>' + (two ? '<th>' + T.thFlat + '</th><th>' + T.thClimb + '</th>' : '<th>' + T.thMotor + '</th>') +
      '<th>' + (unit() === 'grade' ? T.thGrade : 'W/kg') + '</th></tr></thead><tbody>';
    m.rows.forEach(function (x) {
      c += '<tr' + (x.pref ? ' class="pref"' : '') + '><td>' + x.rpm + '</td>' + (two ? '<td>' + w(x.flat) + '</td>' : '') + '<td>' + w(x.climb) + '</td><td>' +
        (unit() === 'grade' ? lastCol(x.climb, x.wkg, inp, r.kg) : kgf(x.wkg)) + '</td></tr>';
    });
    c += '</tbody></table><div class="notes">';
    var ns = boost ? [{ t: T.nBoost(w(m.watt), m.rpmForMax) }] : notesFor(m, inp, next);
    if (!ns.length) ns = [{ t: T.nFull }];
    ns.forEach(function (n) { c += '<p' + (n.w ? ' class="w"' : '') + '>' + n.t + '</p>'; });
    return c + '</div>';
  }
  // Aufgeklappter Bereich unter einer Stufe: links die Tabelle, rechts das Nachstellen. So zeigt sich
  // jede Änderung sofort in der Tabelle. BOOST ist fest und hat nur die Tabelle.
  function openPanel(m, r, inp, next) {
    var h = '<div class="adjust"><div class="card adjtable">' + tableHtml(m, r, inp, next) + '</div>';
    if (m.name === 'BOOST') return h + '</div>';
    var L2 = m.limits;
    h += '<div class="adjctl">';
    if (m.range) {
      h += stepper(m, 'alLo', T.adjAlLo, m.alLo, m.calc.alLo, 1, L2.al[0], m.alHi, String(m.alLo), String(m.calc.alLo));
      h += stepper(m, 'alHi', T.adjAlHi, m.alHi, m.calc.alHi, 1, m.alLo, L2.al[1], String(m.alHi), String(m.calc.alHi));
    } else {
      h += stepper(m, 'al', T.adjAl, m.alHi, m.calc.alHi, 1, L2.al[0], L2.al[1], String(m.alHi), String(m.calc.alHi));
    }
    h += stepper(m, 'watt', T.adjW, m.watt, m.calc.watt, 50, L2.w[0], L2.w[1], w(m.watt), w(m.calc.watt));
    h += stepper(m, 'nm', T.adjNm, m.nm, m.calc.nm, 5, L2.nm[0], L2.nm[1], String(m.nm), String(m.calc.nm));
    h += '<div class="stp end"><button type="button" class="link" data-reset="' + m.name + '"' + (m.adjusted ? '' : ' disabled') + '>' + T.adjReset + '</button></div>';
    return h + '<p class="adjhint">' + T.adjHint + '</p></div></div>';
  }

  function render(inp) {
    var adv = view.adv;
    inp.adjust = adv ? extra.adjust[inp.scope] : {};

      (adv ? '<button type="button" class="tgl" data-m="BOOST" aria-expanded="' + boostOpen + '" aria-label="' + T.adjOpen('BOOST') + '"><i class="tri"></i></button>' : '') + '</div>';
    if (boostOpen) h += openPanel(b, r, inp, null);
    $('list').innerHTML = h;
    $('list').classList.toggle('basic', !adv);
    if (refocus) { var el = $('list').querySelector(refocus); if (el && !el.disabled) el.focus(); refocus = null; }
    $('gradeNote').hidden = unit() !== 'grade';
    $('gradeShort').hidden = unit() !== 'grade';
    $('gradeShort').textContent = T.gradeShort(one(r.kg), view.speed, w(inp.power));
    $('gradeNote').textContent = T.gradeNote(view.speed);
    $('progressText').textContent = T.progress(done, r.modes.length);
    $('clearChecks').hidden = done === 0;

    // Karten mit allen Tabellen nur im Standardrechner. Mit "Erweitert" steht die Tabelle unter der aufgeklappten Stufe.
    var c = '';
    if (!adv) r.modes.concat([b]).forEach(function (m, idx) {
      var boost = m.name === 'BOOST';
      c += '<article class="card"' + (boost ? '' : ' style="--m:' + COLORS[m.name] + '"') + '>' +
        '<div class="band' + (boost ? ' boost' : '') + '"><b>' + m.name + '</b><span>' +
        T.alLabel + ' ' + (boost ? '15' : alText(m)) + ' · ' + w(m.watt) + ' W · ' + m.nm + ' Nm</span></div>' +
        tableHtml(m, r, inp, idx + 1 < r.modes.length ? r.modes[idx + 1] : null) + '</article>';
    });
    $('cardsSection').hidden = adv;
    $('cards').innerHTML = c;

    var names = C.LADDERS[inp.motor].map(function (d) { return d.name; });
    var rules = T.rules(one(r.kg), inp.cadence, w(inp.power));
    if (r.ladder) rules.push(T.rule5(names.slice(0, 2).join(', ')));
    $('rules').innerHTML = rules.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    $('tips').innerHTML = (r.ladder ? T.tipsLadder : T.tipsFour).map(function (t) { return '<li>' + t + '</li>'; }).join('');
    renderCompare(r, inp);
    renderSheet(r, inp);
  }

  function copyText() {
    if (!last) return '';
    var r = last, i = lastInp, out = [T.shareHead(r.motor.label, one(r.kg), i.cadence, w(i.power))];
    r.modes.forEach(function (m) { out.push(T.shareLine(m.name, alText(m).replace(/ /g, ''), w(m.watt), m.nm) + (m.adjusted ? T.shareAdj : '')); });
    return out.join('\n');
  }

  // ---------------------------------------------------------------- Vergleich
  function plain(inp) { return { motor: inp.motor, battery: inp.battery, scope: inp.scope, profile: inp.profile, bike: inp.bike, rider: inp.rider, power: inp.power, cadence: inp.cadence }; }
  function shortLine(r, inp) {
    return 'Avinox ' + r.motor.label + ' · ' + one(r.kg) + ' kg · ' + inp.cadence + ' ' + T.unitRpm + ' · ' + w(inp.power) + ' W · ' + (r.ladder ? T.scopeAll : T[FOCUS[inp.profile]]);
  }
  function cmpCell(m, ref, inp, kg) {
    if (!m) return '<span class="cval none">–</span>';
    var boost = m.name === 'BOOST', al = boost ? '15' : alText(m), ral = ref ? (boost ? '15' : alText(ref)) : al;
    function part(txt, diff) { return '<span' + (diff ? ' class="adj"' : '') + '>' + txt + '</span>'; }
    return '<span class="cval"><b>' + part('AL ' + al, ral !== al) + ' · ' + part(w(m.watt) + ' W', !!ref && ref.watt !== m.watt) + ' · ' + part(m.nm + ' Nm', !!ref && ref.nm !== m.nm) + '</b>' +
      '<small>' + powText(m) + ' · ' + lastCol(m.climb, m.wkg, inp, kg) + '</small></span>';
  }
  function renderCompare(r, inp) {
    var box = $('cmpSection'), opts = [], a = active(), dirty = isDirty();

    if (inp.scope === 'four') Object.keys(FOCUS).forEach(function (f) { if (f !== inp.profile) opts.push({ v: 'focus:' + f, label: T.cmpFocus(T[FOCUS[f]]), focus: f }); });
    profiles.forEach(function (p) {
      var same = p.id === activeId, i = toInput(p.data);
      if ((same && !dirty) || !i) return;
      opts.push({ v: 'prof:' + p.id, label: same ? T.cmpSaved(p.name) : T.cmpProf(p.name), inp: i, data: p.data });
    });
    var pick = opts.filter(function (o) { return o.v === cmp; })[0] || null;
    if (!pick) cmp = '';
    $('cmpSel').innerHTML = '<option value="">' + T.cmpOff + '</option>' + opts.map(function (o) { return '<option value="' + o.v + '">' + esc(o.label) + '</option>'; }).join('');
    $('cmpSel').value = cmp;
    $('cmpSel').disabled = !opts.length;
    $('cmpNone').hidden = !!profiles.length || !!pick;
    $('cmpTable').hidden = !pick;
    if (!pick) return;
    var inpB = pick.focus ? plain(inp) : pick.inp;
    if (pick.focus) { inpB.profile = pick.focus; inpB.adjust = {}; } else inpB.adjust = pick.data.adjust[inpB.scope];
    var rB = C.compute(inpB), names = r.modes.map(function (m) { return m.name; });
    rB.modes.forEach(function (m) { if (names.indexOf(m.name) < 0) names.push(m.name); });
    function find(res, n) { return res.modes.filter(function (m) { return m.name === n; })[0] || null; }
    var h = '<div class="row head"><span class="label">' + T.thMode + '</span>' +
      '<span class="chead"><b>' + esc(a ? a.name + (dirty ? ' (' + T.profDirtyDot + ')' : '') : T.cmpCurrent) + '</b><small>' + shortLine(r, inp) + '</small></span>' +
      '<span class="chead"><b>' + esc(pick.label) + '</b><small>' + shortLine(rB, inpB) + '</small></span></div>';
    names.forEach(function (n) {
      var ma = find(r, n), mb = find(rB, n);
      h += '<div class="row" style="--m:' + COLORS[n] + '"><span class="mode"><i class="sw"></i><b>' + n + '</b></span>' + cmpCell(ma, null, inp, r.kg) + cmpCell(mb, ma, inpB, rB.kg) + '</div>';
    });
    h += '<div class="row" style="--m:var(--boost)"><span class="mode"><i class="sw"></i><b>BOOST</b></span>' + cmpCell(r.boost, null, inp, r.kg) + cmpCell(rB.boost, r.boost, inpB, rB.kg) + '</div>';
    $('cmpTable').innerHTML = h;
  }

  // ---------------------------------------------------------------- Druckansicht
  function renderSheet(r, inp) {
    var a = active(), M = r.motor, grade = unit() === 'grade', any = false, zone = null;
    var facts = [[T.total, one(r.kg) + ' kg (' + T.bike + ' ' + one(inp.bike) + ' + ' + T.rider + ' ' + one(inp.rider) + ')'], [T.power, w(inp.power) + ' W'],
      [T.cadence, inp.cadence + ' ' + T.unitRpm], [T.scope, r.ladder ? T.scopeAll : T.scopeFour + ' · ' + T[FOCUS[inp.profile]]]];
    if (M.batteries) facts.push([T.battery, BATT[inp.battery]]);
    var h = '<header><h1>' + T.sheetTitle(M.label) + '</h1><p class="sub">' + (a ? esc(a.name) + ' · ' : '') + new Date().toLocaleDateString(T.locale) + '</p></header><dl>';
    facts.forEach(function (f) { h += '<div><dt>' + f[0] + '</dt><dd>' + f[1] + '</dd></div>'; });
    h += '</dl><table><thead><tr><th><span class="vh">' + T.sheetTick + '</span></th><th>' + T.thMode + '</th><th>' + T.thAL + '</th><th>' + T.thW + '</th><th>' + T.thNm + '</th>' +
      '<th class="opt">' + T.thMotorAt(inp.cadence) + '</th><th>' + (grade ? T.thGrade : 'W/kg') + '</th></tr></thead><tbody>';
    r.modes.forEach(function (m) {
      if (m.adjusted) any = true;
      if (r.ladder && m.zone !== zone) { zone = m.zone; h += '<tr class="zone"><td colspan="7">' + T.zones[zone] + '</td></tr>'; }
      h += '<tr><td class="box"><i></i></td><td><i class="sw" style="background:' + COLORS[m.name] + '"></i>' + m.name + (m.adjusted ? ' *' : '') + '</td><td>' + alText(m) + '<small>' + pctText(m) + '</small></td>' +
        '<td>' + w(m.watt) + '</td><td>' + m.nm + '</td><td class="opt soft">' + powText(m) + '</td><td class="soft">' + lastCol(m.climb, m.wkg, inp, r.kg) + '</td></tr>';
    });
    var b = r.boost;
    h += '<tr><td></td><td><i class="sw" style="background:#9aa0a8"></i>BOOST<small>' + T.tagFixed + '</small></td><td>15<small>' + T.pct(b.pct) + '</small></td><td>' + w(b.watt) + '</td><td>' + b.nm + '</td>' +
      '<td class="opt soft">' + w(b.climb) + ' W</td><td class="soft">' + lastCol(b.climb, b.wkg, inp, r.kg) + '</td></tr></tbody></table><div class="foot">';
    if (any) h += '<p>* ' + T.sheetAdj + '</p>';
    if (grade) h += '<p>' + T.gradeShort(one(r.kg), view.speed, w(inp.power)) + '</p>';
    h += '<p>' + T.sheetStart + '</p><p>' + T.foot1 + '</p><p>' + SITE.replace(/^https:\/\//, '').replace(/\/$/, '') + '</p></div>';
    $('sheet').innerHTML = h;
  }
  var sheetOpen = false;
  function openSheet() { if (!last) return; sheetOpen = true; $('app').hidden = true; $('sheetWrap').hidden = false; window.scrollTo(0, 0); $('sheetBack').focus(); }
  function closeSheet() { if (!sheetOpen) return; sheetOpen = false; $('app').hidden = false; $('sheetWrap').hidden = true; if (!$('results').hidden) $('print').focus(); }

  // ---------------------------------------------------------------- Profile anzeigen
  function renderProfiles() {
    var a = active(), dirty = isDirty(), h = '';
    profiles.forEach(function (p) {
      var on = p.id === activeId;
      h += '<button type="button" class="chip" data-id="' + p.id + '" aria-pressed="' + on + '">' + esc(p.name) + (on && dirty ? '<i class="dot"></i><span class="vh"> (' + T.profDirtyDot + ')</span>' : '') + '</button>';
    });

    $('profGuard').hidden = !ui.guard;

    $('profExport').hidden = !profiles.length;
    $('profDelete').hidden = !a;
    $('profDelete').textContent = !a ? '' : ui.delArmed ? T.profDeleteConfirm : T.profDelete(a.name);
    $('profMsg').textContent = ui.msg;

  }
  function quiet() { ui.guard = null; ui.msg = ''; ui.fallback = ''; ui.delArmed = false; clearTimeout(ui.delTimer); }

  function update(fromUser) {
    var inp = read();
    cur = snapshot();
    if (fromUser) { ui.guard = null; ui.msg = ''; }
    hints(inp);
    $('empty').hidden = inp.complete;
    $('results').hidden = !inp.complete;
    document.documentElement.classList.toggle('has-sheet', inp.complete);
    if (inp.complete) render(inp);
    else { last = null; lastInp = null; closeSheet(); }
    if (fromUser) save();
    renderProfiles();
  }

  // Liste: Haken setzen, Anpassen auf- und zuklappen, Werte nachstellen
  function modeByName(name) { return last ? last.modes.filter(function (m) { return m.name === name; })[0] : null; }
  $('list').addEventListener('change', function (e) {
    var t = e.target;
    if (!t.classList || !t.classList.contains('chk') || !lastInp) return;
    var m = modeByName(t.getAttribute('data-m')), checks = extra.checks[lastInp.scope];
    if (!m) return;
    if (t.checked) checks[m.name] = sig(m); else delete checks[m.name];
    refocus = '.chk[data-m="' + m.name + '"]';
    update(true);
  });
  $('list').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null;
    if (!t || !lastInp) return;
    var scope = lastInp.scope, adj = extra.adjust[scope], name;
    if (t.classList.contains('tgl')) {
      name = t.getAttribute('data-m');
      openMode = openMode === name ? null : name;
      refocus = '.tgl[data-m="' + name + '"]';
      update(false);
    } else if (t.hasAttribute('data-reset')) {
      name = t.getAttribute('data-reset');
      delete adj[name];
      refocus = '.tgl[data-m="' + name + '"]';
      update(true);
    } else if (t.classList.contains('sb') && t.hasAttribute('data-f')) {
      name = t.getAttribute('data-m');
      var m = modeByName(name), f = t.getAttribute('data-f'), d = parseInt(t.getAttribute('data-d'), 10);
      if (!m) return;
      // Ausgangspunkt ist die tatsächlich wirksame Abweichung, nicht eine an der Grenze abgeschnittene
      var eff = m.range ? { alLo: m.delta.alLo, alHi: m.delta.alHi, watt: m.delta.watt, nm: m.delta.nm }
                        : { al: m.delta.alHi, watt: m.delta.watt, nm: m.delta.nm };
      eff[f] = (eff[f] || 0) + d;
      var any = false, k;
      for (k in eff) { if (eff[k]) any = true; else delete eff[k]; }
      if (any) adj[name] = eff; else delete adj[name];
      refocus = '.sb[data-m="' + name + '"][data-f="' + f + '"][data-d="' + d + '"]';
      update(true);
    }
  });
  $('clearChecks').addEventListener('click', function () {
    if (!lastInp) return;
    extra.checks[lastInp.scope] = {};
    update(true);
  });

  // Zurücksetzen mit Rückfrage: erster Klick fragt, zweiter löscht
  var resetArmed = false, resetTimer = null;
  function disarmReset() { resetArmed = false; clearTimeout(resetTimer); $('reset').textContent = T.reset; $('reset').classList.remove('armed'); }
  $('reset').addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true; $('reset').textContent = T.resetConfirm; $('reset').classList.add('armed');
      resetTimer = setTimeout(disarmReset, 4000);
      return;
    }
    disarmReset();
    applySnapshot({});
    activeId = null; stash = null; sharedNote = false; ui.naming = false; quiet();
    try { localStorage.removeItem(KEY); } catch (e) {}
    saveProfiles();
    update(false);
  });

  $('inputs').addEventListener('input', function (e) { if (e.target.closest && e.target.closest('#profField')) return; update(true); });
  $('inputs').addEventListener('submit', function (e) { e.preventDefault(); });
  function gearPick() {
    var g = $('gear').value; if (!g) return;
    $('cadence').value = CAD[$('ring').value][g];
    update(true);
  }
  $('gear').addEventListener('change', gearPick);
  $('ring').addEventListener('change', gearPick);

  $('copy').addEventListener('click', function () {
    var txt = copyText(), btn = $('copy'), fb = $('copyfallback');
    function done() { btn.textContent = T.copied; setTimeout(function () { btn.textContent = T.copyBtn; }, 1800); }
    function fallback() { fb.hidden = false; fb.value = txt; fb.focus(); fb.select(); btn.textContent = T.copyFallback; }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  // ---------------------------------------------------------------- Profile bedienen
  function selectProfile(id) {
    var p = byId(id); if (!p) return;
    applySnapshot(p.data); activeId = id; stash = null; sharedNote = false; ui.naming = false; quiet();
    update(false); save();
  }
  $('profChips').addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null; if (!t) return;
    if (t.id === 'profAdd') {
      quiet(); ui.naming = true; update(false);
      $('profName').value = ''; $('profName').focus();
      return;
    }
    var id = t.getAttribute('data-id');
    if (id === activeId) return;
    var unsaved = active() ? isDirty() : hasContent(cur);
    if (unsaved && ui.guard !== id) { quiet(); ui.naming = false; ui.guard = id; update(false); $('profSwitch').focus(); return; }
    selectProfile(id);
  });
  $('profSwitch').addEventListener('click', function () { if (ui.guard) selectProfile(ui.guard); });
  $('profStay').addEventListener('click', function () { quiet(); update(false); });
  function createProfile() {
    var name = cleanName($('profName').value);
    if (!name) { ui.msg = T.profErrEmpty; update(false); $('profName').focus(); return; }
    if (profiles.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })) { ui.msg = T.profErrDup; update(false); $('profName').focus(); return; }
    if (profiles.length >= MAXPROF) return;
    var p = { id: newId(), name: name, data: snapshot() };
    profiles.push(p); activeId = p.id; stash = null; sharedNote = false; ui.naming = false; quiet(); ui.msg = T.profSaved(name);
    update(false); save();
  }
  $('profCreate').addEventListener('click', createProfile);
  $('profName').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); createProfile(); }
    if (e.key === 'Escape') { ui.naming = false; quiet(); update(false); }
  });
  $('profCancel').addEventListener('click', function () { ui.naming = false; quiet(); update(false); });
  $('profSave').addEventListener('click', function () {
    var a = active(); if (!a) return;
    a.data = snapshot(); quiet(); ui.msg = T.profSaved(a.name);
    update(false); save();
  });
  $('profDiscard').addEventListener('click', function () {
    var a = active(); if (!a) return;
    applySnapshot(a.data); quiet();
    update(false); save();
  });
  $('profDelete').addEventListener('click', function () {
    var a = active(); if (!a) return;
    if (!ui.delArmed) {
      quiet(); ui.delArmed = true;
      ui.delTimer = setTimeout(function () { ui.delArmed = false; renderProfiles(); }, 4000);
      renderProfiles(); return;
    }
    profiles = profiles.filter(function (p) { return p.id !== a.id; });
    activeId = null; quiet(); ui.msg = T.profDeleted(a.name);
    update(false); save();
  });

  // Sichern und Laden als Datei
  function framed() { try { return window.self !== window.top; } catch (e) { return true; } }
  function anchorSave(name, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' })), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  // done('saved' | 'declined' | 'text'): Im Claude-Fenster fragt die Plattform nach, sonst lädt der Browser die Datei
  function saveFile(name, text, done) {
    var cl = window.claude;
    function direct() { if (framed()) return done('text'); try { anchorSave(name, text); done('saved'); } catch (e) { done('text'); } }
    if (!cl || typeof cl.use !== 'function') return direct();
    cl.use('downloads').then(function (d) {
      if (!d) return direct();
      d.save({ filename: name, data: text }).then(function () { done('saved'); }, function (err) { done(err && err.code === 'declined' ? 'declined' : 'text'); });
    }, direct);
  }
  $('profExport').addEventListener('click', function () {
    if (!profiles.length) return;
    var text = JSON.stringify({ app: 'setup-calculator-for-avinox', version: 1, exported: new Date().toISOString(),
      profiles: profiles.map(function (p) { return { name: p.name, data: p.data }; }) }, null, 1);
    quiet(); ui.msg = T.profExportWait; renderProfiles();
    saveFile(T.profFileName, text, function (state) {
      quiet();
      if (state === 'saved') ui.msg = T.profExported;
      else if (state === 'text') { ui.msg = T.profExportText; ui.fallback = text; }
      renderProfiles();
      if (state === 'text') { $('profFallback').focus(); $('profFallback').select(); }
    });
  });
  function importText(text) {
    var d = null, n = 0, skip = 0;
    try { d = JSON.parse(text); } catch (e) {}
    quiet();
    if (!d || d.app !== 'setup-calculator-for-avinox' || !Array.isArray(d.profiles)) { ui.msg = T.profImportBad; renderProfiles(); return; }
    d.profiles.forEach(function (x) {
      var name = x ? cleanName(x.name) : ''; if (!name) return;
      var old = profiles.filter(function (p) { return p.name.toLowerCase() === name.toLowerCase(); })[0];
      if (old) { old.data = clean(x.data); n++; }
      else if (profiles.length < MAXPROF) { profiles.push({ id: newId(), name: name, data: clean(x.data) }); n++; }
      else skip++;
    });
    if (!n && !skip) { ui.msg = T.profImportBad; renderProfiles(); return; }
    ui.msg = T.profImported(n, skip);
    saveProfiles(); update(false);
  }
  $('profImport').addEventListener('click', function () { $('profFile').value = ''; $('profFile').click(); });
  $('profFile').addEventListener('change', function () {
    var f = $('profFile').files && $('profFile').files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { importText(String(rd.result)); };
    rd.onerror = function () { quiet(); ui.msg = T.profImportBad; renderProfiles(); };
    rd.readAsText(f);
  });

  // ---------------------------------------------------------------- Teilen per Link
  function shareLink() {
    var d = cur, q = ['m=' + d.motor];
    if (C.MOTORS[d.motor].batteries && d.battery) q.push('a=' + d.battery);
    q.push('b=' + d.bike, 'r=' + d.rider, 'p=' + d.power, 'c=' + d.cadence, 's=' + d.scope);
    if (d.scope === 'four') q.push('f=' + d.profile);
    if (view.adv) {
      var parts = [], adj = d.adjust[d.scope];
      Object.keys(adj).forEach(function (n) { Object.keys(adj[n]).forEach(function (f) { parts.push(n + '.' + f + '.' + adj[n][f]); }); });
      if (parts.length) q.push('x=' + encodeURIComponent(parts.join(',')));
    }
    return (PAGES ? location.href.split('#')[0] : SITE) + '#' + q.join('&');
  }
  function fromHash() {
    var h = String(location.hash || '').replace(/^#/, ''), q;
    if (!/(^|&)m=/.test(h)) return null;
    try { q = new URLSearchParams(h); } catch (e) { return null; }
    if (!has(C.MOTORS, q.get('m'))) return null;
    var d = { motor: q.get('m'), battery: q.get('a'), bike: q.get('b'), rider: q.get('r'), power: q.get('p'), cadence: q.get('c'), scope: q.get('s'), profile: q.get('f'), adjust: { four: {}, all: {} } };
    var sc = d.scope === 'all' ? 'all' : 'four', x = q.get('x');
    if (x) x.split(',').forEach(function (part) { var t = part.split('.'); if (t.length !== 3) return; (d.adjust[sc][t[0]] = d.adjust[sc][t[0]] || {})[t[1]] = Number(t[2]); });
    d = clean(d);
    return { data: d, adv: Object.keys(d.adjust[sc]).length > 0 };
  }
  $('share').addEventListener('click', function () {
    if (!last) return;
    var url = shareLink(), btn = $('share'), fb = $('copyfallback');
    function done() { btn.textContent = T.shareCopied; setTimeout(function () { btn.textContent = T.shareBtn; }, 1800); }
    function fallback() { fb.hidden = false; fb.value = url; fb.focus(); fb.select(); btn.textContent = T.shareFallback; }
    function copy() { try { navigator.clipboard.writeText(url).then(done, fallback); } catch (e) { fallback(); } }
    var touch = false; try { touch = window.matchMedia('(pointer: coarse)').matches; } catch (e) {}
    if (touch && navigator.share) {
      try { navigator.share({ title: T.title, text: copyText().split('\n')[0], url: url }).then(function () {}, function (err) { if (!err || err.name !== 'AbortError') copy(); }); } catch (e) { copy(); }
    } else copy();
  });
  $('sharedBack').addEventListener('click', function () {
    if (!stash) return;
    applySnapshot(stash.data); activeId = byId(stash.active) ? stash.active : null; stash = null; sharedNote = false; quiet();
    update(false); save();
  });
  $('sharedClose').addEventListener('click', function () { stash = null; sharedNote = false; update(false); save(); });

  // Vergleich und Druckansicht
  $('cmpSel').addEventListener('change', function () { cmp = $('cmpSel').value; update(false); });
  $('print').addEventListener('click', openSheet);
  $('sheetBack').addEventListener('click', closeSheet);
  $('sheetPrint').addEventListener('click', function () { try { window.print(); } catch (e) {} });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && sheetOpen) closeSheet(); });

  // Erklärungen hinter den i-Knöpfen: am PC beim Drüberfahren (Stil), sonst per Klick oder Antippen.
  // Ein zweiter Klick, ein Klick daneben oder Escape schließt sie wieder.
  function closeTips(except) {
    Array.prototype.forEach.call(document.querySelectorAll('.infobtn[aria-expanded="true"]'), function (el) { if (el !== except) el.setAttribute('aria-expanded', 'false'); });
  }
  document.addEventListener('click', function (e) {
    var t = e.target, btn = t.closest ? t.closest('.infobtn') : null;
    if (btn) {
      var open = btn.getAttribute('aria-expanded') === 'true';
      closeTips(btn);
      btn.setAttribute('aria-expanded', String(!open));
    } else if (!(t.closest && t.closest('.tip'))) closeTips(null);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeTips(null); });

  function chooseLang(l) {
    setLang(l);
    try { localStorage.setItem(LANGKEY, l); } catch (e) {}
    resetArmed = false; clearTimeout(resetTimer); $('reset').classList.remove('armed');
    applyStatic();
    update(false);
  }
  $('lang-de').addEventListener('click', function () { chooseLang('de'); });
  $('lang-en').addEventListener('click', function () { chooseLang('en'); });

  // Umschalter für Design, Einheit und Tempo
  function setView(k, v) { view[k] = v; saveView(); applyView(); update(false); }
  $('look-dark').addEventListener('click', function () { setView('look', 'dark'); });
  $('look-light').addEventListener('click', function () { setView('look', 'light'); });
  $('adv').addEventListener('click', function () { setView('adv', !view.adv); });
  $('unit-wkg').addEventListener('click', function () { setView('unit', 'wkg'); });
  $('unit-grade').addEventListener('click', function () { setView('unit', 'grade'); });
  $('speed-less').addEventListener('click', function () { if (view.speed > 5) setView('speed', view.speed - 1); });
  $('speed-more').addEventListener('click', function () { if (view.speed < 24) setView('speed', view.speed + 1); });

  setLang(lang);
  applyStatic();
  load();
  // Ein Link mit Werten zeigt das geteilte Setup. Die eigenen Eingaben bleiben gespeichert, bis man etwas ändert.
  var shared = fromHash();
  if (shared) {
    var mine = snapshot();
    if (hasContent(mine) || activeId) stash = { data: mine, active: activeId };
    applySnapshot(shared.data); activeId = null; sharedNote = true;
    if (shared.adv) view.adv = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    applyView();
  }
  update(false);
  if (shared && !stash) save();
})();
</script>
</body>
</html>
