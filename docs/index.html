<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Calculator for Avinox</title>
<meta name="description" content="Suggested assist level, max. watts and max. Nm per mode for Avinox M1, M2 and M2S. Einstellungsvorschläge je Modus, Deutsch und Englisch.">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
/* Layout: Eingaben links als feste Spalte, rechts erst die Übertragungsliste, dann die Trittfrequenz-Tabellen je Modus.
   Ein einziges dunkles Schema mit orangem Akzent, passend zur Android-App; folgt nicht der Systemeinstellung. */
:root {
  color-scheme: dark;
  --bg: #0e0e10;
  --surface: #18181b;
  --sunken: #242428;
  --fg: #f4f4f5;
  --muted: #9a9aa2;
  --line: #2e2e33;
  --accent: #ff5a1f;
  --accent-fg: #1a0a02;
  --warn: #f0b458;
  --band-ink: #14181d;
  --boost: #d9d9de;
  --f-display: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
p { margin: 0; }
.top { display: flex; flex-direction: column; gap: 6px; }
.top .lede { color: var(--muted); max-width: 62ch; }
.label { font: 600 0.78rem/1.2 var(--f-display); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }

.layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* Eingaben */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 900px) { .panel { position: static; } }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .legend { font: 600 0.95rem/1.2 var(--f-display); }
.hint { font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
.err { font-size: 0.82rem; color: var(--warn); font-weight: 500; }
.num { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); overflow: hidden; }
.num:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.num input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: 600 1.15rem/1 var(--f-display); padding: 10px 12px; font-variant-numeric: tabular-nums; }
.num input:focus { outline: none; }
.num span { padding-right: 12px; color: var(--muted); font-size: 0.9rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; background: var(--sunken); border-radius: 7px; font-size: 0.9rem; }
.total b { font: 700 1.1rem/1 var(--f-display); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg label { flex: 1; text-align: center; padding: 9px 6px; cursor: pointer; font: 600 0.95rem/1.1 var(--f-display); color: var(--muted); border-left: 1px solid var(--line); position: relative; }
.seg label:first-of-type { border-left: 0; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--sunken); color: var(--accent); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -4px; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
details.helper { font-size: 0.86rem; }
details.helper summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details.helper .inner { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
details.helper select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
.example { font-size: 0.84rem; background: var(--sunken); border-radius: 7px; padding: 8px 12px; color: var(--muted); }

/* Ergebnis */
main { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sechead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; justify-content: space-between; }
.sechead p { color: var(--muted); font-size: 0.92rem; }
button.act { font: 600 0.92rem/1 var(--f-display); padding: 9px 14px; border-radius: 7px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
button.act:hover { background: var(--accent); color: var(--accent-fg); }
button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(112px, 1fr) 92px 78px 66px minmax(150px, 1.5fr); gap: 4px 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.head { background: var(--sunken); padding-block: 8px; }
.row.zone { padding-block: 5px; background: var(--bg); }
.mode { display: flex; align-items: center; gap: 9px; min-width: 0; flex-wrap: wrap; }
.sw { width: 14px; height: 14px; border-radius: 3px; background: var(--m); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.22); flex: none; }
.mode b { font: 700 1.05rem/1.1 var(--f-display); letter-spacing: 0.02em; }
.tag { font: 600 0.68rem/1 var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; }
.val { font: 700 1.2rem/1.1 var(--f-display); }
.val small { display: block; font: 400 0.76rem/1.2 var(--f-body); color: var(--muted); }
.meter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.track { position: relative; height: 12px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--m); box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.22); border-radius: 3px; }
.track i.climb { opacity: 0.45; }
.meter span { font-size: 0.8rem; color: var(--muted); }
.meter span b { color: var(--fg); font-weight: 600; }
@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr) 70px 58px 46px; padding-inline: 12px; gap: 6px 10px; }
  .row .meter { grid-column: 1 / -1; }
  .row.head .meterhead { display: none; }
  .val { font-size: 1.08rem; }
}
.legend-line { font-size: 0.82rem; color: var(--muted); }

/* Karten je Modus */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.band { background: var(--m); color: var(--band-ink); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.band.boost { background: var(--boost); color: var(--band-ink); }
.band b { font: 700 1.15rem/1.1 var(--f-display); letter-spacing: 0.03em; }
.band span { font-size: 0.86rem; font-weight: 500; }
.card table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.card th { font: 600 0.72rem/1.2 var(--f-display); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 8px 14px 6px; }
.card td { text-align: right; padding: 4px 14px; border-top: 1px solid var(--line); }
.card th:first-child, .card td:first-child { text-align: left; }
.card tr.pref td { font-weight: 600; background: var(--sunken); }
.notes { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.84rem; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
.notes p.w { color: var(--warn); }

.prose { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px 28px; }
@media (max-width: 760px) { .prose { grid-template-columns: minmax(0, 1fr); } }
.prose ol, .prose ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; font-size: 0.93rem; max-width: 65ch; }
.prose .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.altable { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.altable td { padding: 3px 8px; border-top: 1px solid var(--line); text-align: right; }
.altable td:nth-child(odd) { color: var(--muted); text-align: left; }
footer { color: var(--muted); font-size: 0.84rem; max-width: 80ch; display: flex; flex-direction: column; gap: 6px; }
#copyfallback { width: 100%; min-height: 9em; font: 0.85rem/1.4 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: 10px; }

.toprow { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.lang { display: flex; flex: none; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.lang button { font: 600 0.82rem/1 var(--f-display); letter-spacing: 0.04em; padding: 8px 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button[aria-pressed="true"] { background: var(--sunken); color: var(--accent); }
.lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

.results { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 22px; display: flex; flex-direction: column; gap: 8px; }
.empty p { color: var(--muted); max-width: 56ch; }
button.reset { align-self: flex-start; font: 600 0.9rem/1 var(--f-display); padding: 9px 12px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
button.reset:hover { color: var(--fg); border-color: var(--muted); }
button.reset.armed { color: var(--warn); border-color: var(--warn); }
button.reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <span class="label">M1 · M2 · M2S</span>
      <div class="lang" role="group" aria-label="Sprache / Language">
        <button type="button" id="lang-de" aria-pressed="false">DE</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 id="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
  </header>

  <div class="layout">
    <form class="panel" id="inputs" autocomplete="off">
      <fieldset class="field">
        <span class="legend" data-i18n="motor"></span>
        <div class="seg">
          <label><input type="radio" name="motor" id="motor-M1" value="M1">M1</label>
          <label><input type="radio" name="motor" id="motor-M2" value="M2">M2</label>
          <label><input type="radio" name="motor" id="motor-M2S" value="M2S">M2S</label>
        </div>
        <span class="hint" id="motorHint"></span>
      </fieldset>

      <div class="field">
        <div class="pair">
          <div class="field">
            <label for="bike" data-i18n="bike"></label>
            <div class="num"><input id="bike" type="number" inputmode="decimal" min="10" max="45" step="0.5"><span>kg</span></div>
          </div>
          <div class="field">
            <label for="rider" data-i18n="rider"></label>
            <div class="num"><input id="rider" type="number" inputmode="decimal" min="40" max="180" step="0.5"><span>kg</span></div>
          </div>
        </div>
        <span class="hint" data-i18n="weightHint"></span>
        <span class="err" id="err-weight" hidden></span>
        <div class="total"><span data-i18n="total"></span><b id="total"></b></div>
      </div>

      <div class="field">
        <label for="power" data-i18n="power"></label>
        <div class="num"><input id="power" type="number" inputmode="numeric" min="50" max="500" step="5"><span data-i18n="unitW"></span></div>
        <span class="hint" data-i18n="powerHint"></span>
        <span class="err" id="err-power" hidden></span>
      </div>

      <div class="field">
        <label for="cadence" data-i18n="cadence"></label>
        <div class="num"><input id="cadence" type="number" inputmode="numeric" min="40" max="120" step="1"><span data-i18n="unitRpm"></span></div>
        <span class="err" id="err-cadence" hidden></span>
        <details class="helper" id="cadHelper">
          <summary data-i18n="gearSummary"></summary>
          <div class="inner">
            <span class="hint" data-i18n="gearQuestion"></span>
            <div class="pair">
              <select id="ring"></select>
              <select id="gear"></select>
            </div>
          </div>
        </details>
      </div>

      <fieldset class="field">
        <span class="legend" data-i18n="scope"></span>
        <div class="seg">
          <label><input type="radio" name="scope" id="scope-four" value="four" checked><span data-i18n="scopeFour"></span></label>
          <label><input type="radio" name="scope" id="scope-all" value="all"><span data-i18n="scopeAll"></span></label>
        </div>
        <span class="hint" id="scopeHint"></span>
      </fieldset>

      <fieldset class="field" id="profileField">
        <span class="legend" data-i18n="focus"></span>
        <div class="seg">
          <label><input type="radio" name="profile" id="profile-allround" value="allround" checked><span data-i18n="pAllround"></span></label>
          <label><input type="radio" name="profile" id="profile-long" value="long"><span data-i18n="pLong"></span></label>
          <label><input type="radio" name="profile" id="profile-power" value="power"><span data-i18n="pPower"></span></label>
        </div>
        <span class="hint" id="profileHint"></span>
      </fieldset>

      <button type="button" class="reset" id="reset"></button>
    </form>

    <main>
      <div class="empty" id="empty" hidden>
        <h2 data-i18n="emptyTitle"></h2>
        <p data-i18n="emptyText"></p>
      </div>

      <div class="results" id="results">
      <section>
        <div class="sechead">
          <div>
            <h2 data-i18n="h2settings"></h2>
            <p id="summary"></p>
          </div>
          <button type="button" class="act" id="copy"></button>
        </div>
        <div class="list" id="list"></div>
        <p class="legend-line" id="legendLine"></p>
        <textarea id="copyfallback" hidden readonly></textarea>
      </section>

      <section>
        <div class="sechead">
          <div>
            <h2 data-i18n="h2power"></h2>
            <p data-i18n="h2powerSub"></p>
          </div>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <section>
        <h2 data-i18n="h2how"></h2>
        <div class="prose">
          <div class="col">
            <ol id="rules"></ol>
            <ul id="tips"></ul>
          </div>
          <div class="col">
            <h3 data-i18n="alTitle"></h3>
            <table class="altable" id="altable"></table>
            <span class="hint" data-i18n="alHint"></span>
          </div>
        </div>
      </section>
      </div>
    </main>
  </div>

  <footer>
    <p data-i18n="foot1"></p>
    <p id="foot2"></p>
  </footer>
</div>

<script>
/* Rechenkern: Setup-Rechner für Avinox.
   Rechenweg nach dem Setup-Guide von Bernd Hemmersbach (Vorabfassung 11.05.2026)
   und den Blättern "Generelles Setup" (M1, M2, M2S). */
var AvinoxCalc = (function () {
  // Assist Level -> Unterstützung in % (Testfahrten des Autors mit dem M1)
  var AL = [0, 30, 60, 80, 100, 125, 150, 175, 225, 300, 375, 450, 525, 675, 825, 950];
  var K = 9.55; // Watt = Nm x U/min / 9,55

  var MOTORS = {
    M1:  { label: 'M1',  nm: 105, watt: 1000, boostNm: 120, boostW: 1000 },
    M2:  { label: 'M2',  nm: 110, watt: 1000, boostNm: 125, boostW: 1100 },
    M2S: { label: 'M2S', nm: 130, watt: 1300, boostNm: 150, boostW: 1500 }
  };

  // Zielwerte in Watt Motorleistung je kg Gesamtgewicht (Guide 2.5, 3.5, 3.6)
  var PROFILES = {
    allround: { label: 'Alleskönner', modes: {
      ECO: { t: 1.4, band: [1, 1.5] }, AUTO: { t: 2.75, band: [2, 3] },
      TRAIL: { t: 5.5, band: [4.5, 6] }, TURBO: { t: 7.75, band: [6, 8] } } },
    long: { label: 'Langstrecke', modes: {
      ECO: { t: 0.9, band: [0.75, 1] }, AUTO: { t: 1.8, band: [1.5, 2] },
      TRAIL: { t: 2.75, band: [2.5, 3.5] }, TURBO: { t: 4.1, band: [3.5, 5] } } },
    power: { label: 'Power', modes: {
      ECO: { t: 1.8, band: [1.5, 2] }, AUTO: { t: 4.1, band: [3, 4.5] },
      TRAIL: { t: 6.4, band: [6, 7.5] }, TURBO: { t: 9.1, band: [7.5, 10] } } }
  };

  // Modus-Leitern der Blätter "Generelles Setup"
  var LADDERS = {
    M1: [
      { name: 'LOW',    zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'ECO',    zone: 'low',  t: 1.4, al: 'below', std: 'ECO' },
      { name: 'ROAD',   zone: 'low',  t: 2.0, al: 'below' },
      { name: 'AUTO',   zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL',  zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO',  zone: 'mid',  t: 5.6, std: 'TURBO' },
      { name: 'BEAST',  zone: 'high', t: 7.5 },
      { name: 'ALL IN', zone: 'high', top: true }
    ],
    M2: [
      { name: 'LOW',   zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'FLAT',  zone: 'low',  t: 1.4, al: 'below' },
      { name: 'ECO',   zone: 'low',  t: 1.8, std: 'ECO' },
      { name: 'ROAD',  zone: 'mid',  t: 2.2 },
      { name: 'AUTO',  zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL', zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO', zone: 'high', t: 5.6, std: 'TURBO' },
      { name: 'POWER', zone: 'high', t: 7.5 },
      { name: 'BEAST', zone: 'high', top: true }
    ],
    M2S: [
      { name: 'LOW',    zone: 'low',  t: 0.9, al: 'below', nmEff: true },
      { name: 'ECO',    zone: 'low',  t: 1.4, al: 'below', std: 'ECO' },
      { name: 'ROAD',   zone: 'low',  t: 2.1, al: 'below' },
      { name: 'AUTO',   zone: 'mid',  t: 3.0, range: true, std: 'AUTO' },
      { name: 'TRAIL',  zone: 'mid',  t: 4.2, range: true, std: 'TRAIL' },
      { name: 'TURBO',  zone: 'mid',  t: 5.6, std: 'TURBO' },
      { name: 'BEAST',  zone: 'high', t: 7.5 },
      { name: 'ALL IN', zone: 'high', t: 9.0 },
      { name: 'MTWOS',  zone: 'high', top: true }
    ]
  };

  // Einstellbereiche der vier Werksmodi (Guide 1.2, M1). Obergrenzen folgen dem Motor.
  function limits(std, M) {
    switch (std) {
      case 'ECO':   return { al: [1, 7],  nm: [10, 70],   w: [100, 400] };
      case 'AUTO':  return { al: [3, 11], nm: [10, M.nm], w: [200, M.watt] };
      case 'TRAIL': return { al: [6, 13], nm: [20, M.nm], w: [300, M.watt] };
      case 'TURBO': return { al: [8, 15], nm: [60, M.nm], w: [400, M.watt] };
      default:      return { al: [1, 15], nm: [10, M.nm], w: [100, M.watt] };
    }
  }

  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function ceil5(x) { return Math.ceil((x - 1e-9) / 5) * 5; }
  function round50(x) { return Math.round(x / 50 + 1e-9) * 50; }
  function round100(x) { return Math.round(x / 100 + 1e-9) * 100; }

  // Nächsthöhere Stufe, die die nötige Unterstützung liefert (2 % Toleranz)
  function alMatch(watt, own) {
    var req = watt / own * 100;
    for (var L = 1; L <= 15; L++) if (AL[L] >= req * 0.98) return L;
    return 15;
  }
  // Höchste Stufe, die unter der Wattgrenze bleibt (Reichweiten-Stufen)
  function alBelow(watt, own) {
    var req = watt / own * 100, r = 1;
    for (var L = 1; L <= 15; L++) if (AL[L] < req - 1e-9) r = L;
    return r;
  }

  function build(defs, inp, M, ladder) {
    var kg = inp.bike + inp.rider, own = inp.power, cad = inp.cadence;
    var n = defs.length, i;
    var modes = defs.map(function (d) {
      return { name: d.name, zone: d.zone || null, custom: !d.std, range: !!d.range,
               band: d.band || null, lim: limits(d.std, M), flags: {} };
    });

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (!s) return;
      FIELDS.forEach(function (k) { if (s[k] != null && s[k] === s[k]) $(k).value = s[k]; });
      ['motor', 'scope', 'profile'].forEach(function (k) { if (s[k]) setRadio(k, s[k]); });
    } catch (e) {}
  }
  // Speichert auch unvollständige Eingaben, damit nichts verloren geht
  function save() {
    var s = { motor: radio('motor'), scope: radio('scope'), profile: radio('profile') };
    FIELDS.forEach(function (k) { s[k] = $(k).value; });
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  // Liest das Formular. Ein leeres Feld ist kein Fehler, nur ein ausgefülltes mit unpassendem Wert.
  function read() {
    var raw = { motor: radio('motor'), scope: radio('scope'), profile: radio('profile') }, filled = {}, ok = true;
    FIELDS.forEach(function (k) { var v = $(k).value.trim(); filled[k] = v !== ''; raw[k] = parseFloat(v); });
    function inRange(k, lo, hi) { return raw[k] >= lo && raw[k] <= hi; }
    function check(id, good, msg) { var e = $(id); e.hidden = good; e.textContent = good ? '' : msg; if (!good) ok = false; }
    check('err-weight', (!filled.bike || inRange('bike', 10, 45)) && (!filled.rider || inRange('rider', 40, 180)), T.errWeight);
    check('err-power', !filled.power || inRange('power', 50, 500), T.errPower);
    check('err-cadence', !filled.cadence || inRange('cadence', 40, 120), T.errCadence);
    raw.complete = ok && !!raw.motor && FIELDS.every(function (k) { return filled[k]; });
    raw.hasWeight = filled.bike && filled.rider && raw.bike === raw.bike && raw.rider === raw.rider;
    return raw;
  }

  // Hinweise neben den Eingaben, auch wenn noch nicht alles ausgefüllt ist
  function hints(inp) {
    var M = inp.motor ? C.MOTORS[inp.motor] : null;
    $('total').textContent = inp.hasWeight ? one(inp.bike + inp.rider) + ' kg' : '–';
    $('motorHint').textContent = M ? T.motorHint(M.nm, w(M.watt), M.boostNm, w(M.boostW)) : T.motorChoose;
    if (inp.scope === 'all') {
      var names = M ? C.LADDERS[inp.motor].map(function (d) { return d.name; }) : null;
      $('scopeHint').textContent = names ? T.scopeAllHint(names.length, names.join(', ')) : T.motorChoose;
    } else {
      $('scopeHint').textContent = T.scopeFourHint;
    }
    $('profileField').hidden = inp.scope === 'all';
    $('profileHint').textContent = T.profileHint[inp.profile];
  }

  function alText(m) { return m.alLo === m.alHi ? String(m.alLo) : m.alLo + ' – ' + m.alHi; }
  function pctText(m) { return m.alLo === m.alHi ? T.pct(m.pctHi) : T.pct(m.pctLo, m.pctHi); }
  function powText(m) {
    return (Math.round(m.flat) === Math.round(m.climb) ? w(m.climb) : w(m.flat) + ' – ' + w(m.climb)) + ' W';
  }

  function notesFor(m, inp) {
    var out = [], eps = 0.5, cad = inp.cadence;
    var reach = Math.min(m.watt, m.alWatt);
    if (m.nmWatt < reach - eps) out.push({ w: true, t: T.nNm(cad, w(m.nmWatt), w(m.watt), m.rpmForMax) });
    if (m.alWatt < m.watt - eps) out.push({ t: T.nAl(w(inp.power), w(m.alWatt), w(m.watt)) });
    if (m.band) {
      if (m.wkg < m.band[0] - 0.005) out.push({ w: true, t: T.nBelow(one(m.band[0]), one(m.band[1])) });
      else out.push({ t: T.nBand(one(m.band[0]), one(m.band[1])) });
    }
    if (m.flags.nmMin || m.flags.wattMin) out.push({ t: T.nMin });
    if (m.flags.nmSpread) out.push({ t: T.nSpread });
    return out;
  }

  function render(inp) {
    var r = C.compute(inp), M = r.motor, scale = M.boostW;
    last = r; lastInp = inp;
    $('summary').textContent = T.summary(M.label, one(r.kg), inp.cadence, w(inp.power));

    var h = '<div class="row head"><span class="label">' + T.thMode + '</span><span class="label">' + T.thAL + '</span><span class="label">' + T.thW + '</span><span class="label">' + T.thNm + '</span><span class="label meterhead">' + T.thMotorAt(inp.cadence) + '</span></div>';
    var zone = null;
    r.modes.forEach(function (m) {
      if (r.ladder && m.zone !== zone) { zone = m.zone; h += '<div class="row zone"><span class="label" style="grid-column:1/-1">' + T.zones[zone] + '</span></div>'; }
      h += '<div class="row" style="--m:' + COLORS[m.name] + '">' +
        '<span class="mode"><i class="sw"></i><b>' + m.name + '</b>' + (r.ladder && m.custom ? '<span class="tag">' + T.tagNew + '</span>' : '') + '</span>' +
        '<span class="val">' + alText(m) + '<small>' + pctText(m) + '</small></span>' +
        '<span class="val">' + w(m.watt) + '</span>' +
        '<span class="val">' + m.nm + '</span>' +
        '<span class="meter"><span class="track"><i class="climb" style="width:' + (m.climb / scale * 100).toFixed(1) + '%"></i><i style="width:' + (m.flat / scale * 100).toFixed(1) + '%"></i></span>' +
        '<span><b>' + powText(m) + '</b> · ' + kgf(m.wkg) + ' W/kg</span></span></div>';
    });
    var b = r.boost;
    h += '<div class="row" style="--m:var(--boost)">' +
      '<span class="mode"><i class="sw"></i><b>BOOST</b><span class="tag">' + T.tagFixed + '</span></span>' +
      '<span class="val">15<small>' + T.pct(b.pct) + '</small></span><span class="val">' + w(b.watt) + '</span><span class="val">' + b.nm + '</span>' +
      '<span class="meter"><span class="track"><i style="width:' + (b.climb / scale * 100).toFixed(1) + '%"></i></span>' +
      '<span><b>' + w(b.climb) + ' W</b> · ' + kgf(b.wkg) + ' W/kg</span></span></div>';
    $('list').innerHTML = h;
    $('legendLine').textContent = T.legend(inp.cadence, w(inp.power), w(scale));

    var c = '';
    r.modes.concat([b]).forEach(function (m) {
      var boost = m.name === 'BOOST', two = !boost && m.alLo !== m.alHi;
      c += '<article class="card"' + (boost ? '' : ' style="--m:' + COLORS[m.name] + '"') + '>' +
        '<div class="band' + (boost ? ' boost' : '') + '"><b>' + m.name + '</b><span>' +
        T.alLabel + ' ' + (boost ? '15' : alText(m)) + ' · ' + w(m.watt) + ' W · ' + m.nm + ' Nm</span></div>' +
        '<table><thead><tr><th>' + T.thRpm + '</th>' + (two ? '<th>' + T.thFlat + '</th><th>' + T.thClimb + '</th>' : '<th>' + T.thMotor + '</th>') + '<th>W/kg</th></tr></thead><tbody>';
      m.rows.forEach(function (x) {
        c += '<tr' + (x.pref ? ' class="pref"' : '') + '><td>' + x.rpm + '</td>' + (two ? '<td>' + w(x.flat) + '</td>' : '') + '<td>' + w(x.climb) + '</td><td>' + kgf(x.wkg) + '</td></tr>';
      });
      c += '</tbody></table><div class="notes">';
      var ns = boost ? [{ t: T.nBoost(w(b.watt), b.rpmForMax) }] : notesFor(m, inp);
      if (!ns.length) ns = [{ t: T.nFull }];
      ns.forEach(function (n) { c += '<p' + (n.w ? ' class="w"' : '') + '>' + n.t + '</p>'; });
      c += '</div></article>';
    });
    $('cards').innerHTML = c;

    var names = C.LADDERS[inp.motor].map(function (d) { return d.name; });
    var rules = T.rules(one(r.kg), inp.cadence, w(inp.power));
    if (r.ladder) rules.push(T.rule5(names.slice(0, 2).join(', ')));
    $('rules').innerHTML = rules.map(function (t) { return '<li>' + t + '</li>'; }).join('');
    $('tips').innerHTML = (r.ladder ? T.tipsLadder : T.tipsFour).map(function (t) { return '<li>' + t + '</li>'; }).join('');
  }

  function copyText() {
    if (!last) return '';
    var r = last, i = lastInp, out = [T.shareHead(r.motor.label, one(r.kg), i.cadence, w(i.power))];
    r.modes.forEach(function (m) { out.push(T.shareLine(m.name, alText(m).replace(/ /g, ''), w(m.watt), m.nm)); });
    return out.join('\n');
  }

  function update(fromUser) {
    var inp = read();
    hints(inp);
    $('empty').hidden = inp.complete;
    $('results').hidden = !inp.complete;
    if (inp.complete) render(inp);
    else { last = null; lastInp = null; }
    if (fromUser) save();
  }

  // Zurücksetzen mit Rückfrage: erster Klick fragt, zweiter löscht
  var resetArmed = false, resetTimer = null;
  function disarmReset() { resetArmed = false; clearTimeout(resetTimer); $('reset').textContent = T.reset; $('reset').classList.remove('armed'); }
  $('reset').addEventListener('click', function () {
    if (!resetArmed) {
      resetArmed = true; $('reset').textContent = T.resetConfirm; $('reset').classList.add('armed');
      resetTimer = setTimeout(disarmReset, 4000);
      return;
    }
    disarmReset();
    FIELDS.forEach(function (k) { $(k).value = ''; });
    Array.prototype.forEach.call(document.querySelectorAll('input[name="motor"]'), function (el) { el.checked = false; });
    setRadio('scope', 'four'); setRadio('profile', 'allround');
    $('gear').value = ''; $('copyfallback').hidden = true;
    try { localStorage.removeItem(KEY); } catch (e) {}
    update(false);
  });

  $('inputs').addEventListener('input', function () { update(true); });
  $('inputs').addEventListener('submit', function (e) { e.preventDefault(); });
  function gearPick() {
    var g = $('gear').value; if (!g) return;
    $('cadence').value = CAD[$('ring').value][g];
    update(true);
  }
  $('gear').addEventListener('change', gearPick);
  $('ring').addEventListener('change', gearPick);

  $('copy').addEventListener('click', function () {
    var txt = copyText(), btn = $('copy'), fb = $('copyfallback');
    function done() { btn.textContent = T.copied; setTimeout(function () { btn.textContent = T.copyBtn; }, 1800); }
    function fallback() { fb.hidden = false; fb.value = txt; fb.focus(); fb.select(); btn.textContent = T.copyFallback; }
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  });

  function chooseLang(l) {
    setLang(l);
    try { localStorage.setItem(LANGKEY, l); } catch (e) {}
    resetArmed = false; clearTimeout(resetTimer); $('reset').classList.remove('armed');
    applyStatic();
    update(false);
  }
  $('lang-de').addEventListener('click', function () { chooseLang('de'); });
  $('lang-en').addEventListener('click', function () { chooseLang('en'); });

  setLang(lang);
  applyStatic();
  load();
  update(false);
})();
</script>
</body>
</html>
